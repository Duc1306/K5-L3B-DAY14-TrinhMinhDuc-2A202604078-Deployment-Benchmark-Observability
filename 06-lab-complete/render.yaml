# ============================================================
# Render Blueprint (tiêu chí 12) — dùng thay railway.toml nếu deploy Render.
# File nằm trong 06-lab-complete/ → khi tạo Blueprint chọn đường dẫn file này,
# rootDir trỏ về thư mục này. Redis (Key Value) được khai báo luôn ở dưới.
# ============================================================
services:
  - type: web
    name: day14-agent
    runtime: docker
    rootDir: 06-lab-complete
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: AGENT_API_KEY
        generateValue: true          # Render tự sinh secret, không ghi giá trị ở đây
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: day14-redis
          property: connectionString
      - key: RATE_LIMIT_PER_MINUTE
        value: "10"
      - key: DAILY_BUDGET_USD
        value: "1.0"
      - key: MONTHLY_BUDGET_USD
        value: "10.0"

  - type: keyvalue
    name: day14-redis
    plan: free
    ipAllowList: []                  # chỉ service trong Render truy cập được
    maxmemoryPolicy: noeviction
