# ============================================================
# Agent + Redis bằng một lệnh (tiêu chí 2)
#   cp .env.example .env      # rồi đặt AGENT_API_KEY
#   docker compose -p k5-day14-agent up --build
# ============================================================
services:
  agent:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - path: .env          # secrets local (đã nằm trong .gitignore)
        required: false     # không có .env vẫn chạy được
    environment:
      # Ghi đè REDIS_URL trong .env (localhost) bằng tên service trong network của compose
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 10s

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "128mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  redis_data:
